<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#11283b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NISA 買い時">
  <title>NISA 買い時</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="frame masthead-inner">
      <img src="./icons/icon-192.png" width="44" height="44" alt="">
      <div><strong>NISA 買い時</strong><span>成長投資枠の参考指標</span></div>
    </div>
  </header>
  <main class="frame">
    <p id="storage-status" class="notice warning" role="status" hidden></p>
    <div id="view" aria-labelledby="view-title">
      <h1 id="view-title">今日</h1>
      <p>データを読み込んでいます。</p>
    </div>
    <footer>投資助言ではありません。データや受渡日の推定値は参考情報です。公式画面で確認してください。SBI証券とは無関係です。</footer>
  </main>
  <nav class="tabbar" aria-label="画面">
    <div class="frame tabs">
      <button type="button" data-tab="today" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" fill="none" aria-hidden="true"><path d="M3 17a9 9 0 0 1 18 0M12 17l4-5M7 12l-1-1M12 10V8"/></svg>今日</button>
      <button type="button" data-tab="chart"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" fill="none" aria-hidden="true"><path d="M3 4v16h18M6 15l4-5 4 3 6-7"/></svg>チャート</button>
      <button type="button" data-tab="plan"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" fill="none" aria-hidden="true"><path d="M4 6h16v15H4zM8 3v6m8-6v6M4 11h16m-12 4h2m4 0h2"/></svg>計画</button>
      <button type="button" data-tab="verify"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" fill="none" aria-hidden="true"><path d="M3 20h18M5 20v-7h3v7m3 0V5h3v15m3 0V9h3v11"/></svg>検証</button>
      <button type="button" data-tab="settings"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" fill="none" aria-hidden="true"><path d="M10 3h4l.5 2.5 2 .9 2.2-1.2 2.1 3.6-2 1.6v3.2l2 1.6-2.1 3.6-2.2-1.2-2 .9L14 21h-4l-.5-2.5-2-.9-2.2 1.2-2.1-3.6 2-1.6v-3.2l-2-1.6 2.1-3.6 2.2 1.2 2-.9z"/><circle cx="12" cy="12" r="3"/></svg>設定</button>
    </div>
  </nav>
  <dialog id="disclaimer" aria-labelledby="disclaimer-title">
    <h2 id="disclaimer-title">ご利用の前に</h2>
    <p>このアプリは投資助言を行いません。価格の推定値や予測は外れることがあります。</p>
    <p>注文締切・約定日・受渡日・年内受渡の最終注文日は推定です。公式画面で確認し、ご自身で判断・注文してください。SBI証券や運用会社とは無関係です。</p>
    <button type="button" class="primary" id="agree">確認しました</button>
  </dialog>
</body>
</html>
